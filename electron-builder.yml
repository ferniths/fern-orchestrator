appId: dev.fern.orchestrator
productName: Fern Orchestrator
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowElevation: true
  perMachine: false
linux:
  target:
    - AppImage
    - deb
  category: Development
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
